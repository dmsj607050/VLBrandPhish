inherits: base_config.yaml

stage: "stage2"
model_name: "google/siglip-base-patch16-224"

objective: "tri_sig"
dataset_type: "flat"
data_root: ""
val_ratio: 0.1
flat_numeric_suffix_only: false
flat_excluded_filenames:
  - homepage_html.txt
  - homepage.png
  - login_html.txt
  - loginpage.png
  - tfidf.csv

output_dir: "./outputs_stage2_trisig"
save_each_epoch: true

batch_size: 32
epochs: 20

lr: 5.0e-5
warmup_ratio: 0.1
layer_decay: 0.9

lr_scale_vision: 0.5
lr_scale_text: 0.08
lr_scale_logit: 0.05

unfreeze_vision_last_n: 6
freeze_text: "except_last_n"
unfreeze_text_last_n: 2

classes_per_batch: 16
samples_per_class: 2

image_proto_agg: "attention"
image_proto_agg_tau: 0.07
image_proto_max_images_per_class: 8
# Fusion weights for combining image and text logits during training.
# Default 0.8 / 0.2 matches the reported VLBrandPhish configuration.
image_weight: 0.8
text_weight: 0.2
# 0 = never rebuild image prototypes after initial build.
# Stage-2 unfreezes 6 vision + 2 text layers, so vision drift is significant.
# Keeping prototypes fixed matches the reported experiment. For a fresh run
# consider setting this to 3-5 so prototypes track the evolving encoder.
image_proto_rebuild_interval: 0

loss_weights:
  lambda_cls: 1.0
  lambda_it: 0.3
  lambda_ii: 0.3
  lambda_consistency: 0.03
  lambda_margin: 0.03

losses:
  cls: true
  it: true
  ii: true
  consistency: true
  adaptive_margin: true

adaptive_margin:
  min_margin: 0.0
  max_margin: 0.2

label_smoothing: 0.05
early_stop_patience: 8

prompts:
  mode: "hybrid"
  include_simple13: true
  include_five_dim: true

resume: "./outputs_stage1_trisig_logo2k/best.pt"
