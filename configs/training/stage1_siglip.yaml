stage: "stage1"
seed: 42

model_name: "google/siglip-base-patch16-224"
prompt_ensemble: "mean"

amp: true
workers: 4
log_interval: 50
grad_clip_norm: 1.0

objective: "pairwise"
dataset_type: "logo2k"
data_root: ""
val_ratio: 0.05
output_dir: "./outputs_stage1"
plot_loss_curves: true
save_each_epoch: false

batch_size: 64
epochs: 8
grad_accum_steps: 1

lr: 2.0e-5
weight_decay: 0.05
warmup_ratio: 0.05
min_lr_ratio: 0.05
layer_decay: 0.85

lr_scale_vision: 1.0
lr_scale_text: 0.1
lr_scale_gate: 1.0
lr_scale_adapter: 1.0
lr_scale_logit: 0.1

freeze_vision: "except_last_n"
unfreeze_vision_last_n: 4
freeze_text: "all"
train_logit: true

class_aware_sampler: true
classes_per_batch: 64
samples_per_class: 1

full_eval_interval: 1
proto_refresh_interval: 2
early_stop_patience: 3
early_stop_min_delta: 0.001

prompts:
  mode: "hybrid"
  force_include_brand_name: true
  fallback_to_simple13: true
  max_prompts_per_brand: 8
  templates:
    - "{brand}"
    - "{brand} logo"
    - "logo of {brand}"
    - "official logo of {brand}"
    - "{brand} brand logo"
    - "{brand} wordmark"
    - "{brand} logomark"
    - "a clean logo of {brand}"
