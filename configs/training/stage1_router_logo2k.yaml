stage: "stage1"
seed: 42
deterministic: true

model_name: "./siglip-base-patch16-224"
prompt_ensemble: "mean"

amp: true
workers: 4
log_interval: 50
grad_clip_norm: 1.0

objective: "tri_sig"
dataset_type: "logo2k"
data_root: ""
val_ratio: 0.05
output_dir: "./outputs_stage1_router_logo2k"
plot_loss_curves: true
save_each_epoch: true

batch_size: 32
epochs: 8
grad_accum_steps: 1

class_aware_sampler: true
classes_per_batch: 16
samples_per_class: 2

lr: 3.0e-5
weight_decay: 0.05
warmup_ratio: 0.05
min_lr_ratio: 0.05
layer_decay: 0.9

lr_scale_vision: 0.5
lr_scale_text: 0.05
lr_scale_router: 0.8
lr_scale_adapter: 1.5
lr_scale_logit: 0.05

freeze_vision: "except_last_n"
unfreeze_vision_last_n: 4

freeze_text: "all"
train_logit: true

use_adapter: true
adapter_hidden_dim: 256
adapter_dropout: 0.10
train_adapter: true

router_hidden_dim: 256
router_dropout: 0.10
train_router: true

image_proto_agg: "attention"
image_proto_agg_tau: 0.07
image_proto_max_images_per_class: 8
use_adapter_for_prototypes: false
image_proto_rebuild_interval: 0

loss_weights:
  lambda_cls: 1.0
  lambda_it: 0.3
  lambda_ii: 0.3
  lambda_consistency: 0.03
  lambda_margin: 0.03
  lambda_router: 0.02
  lambda_uncertainty: 0.01

losses:
  cls: true
  it: true
  ii: true
  consistency: true
  adaptive_margin: true
  router: true
  uncertainty: true

adaptive_margin:
  min_margin: 0.0
  max_margin: 0.15

router_supervision: "oracle_ce"
router_oracle_temperature: 0.7

label_smoothing: 0.05
full_eval_interval: 1
proto_refresh_interval: 3
early_stop_patience: 3
early_stop_min_delta: 0.001

prompts:
  mode: "hybrid"
  force_include_brand_name: true
  fallback_to_simple13: true
  max_prompts_per_brand: 8
  templates:
    - "{brand}"
    - "{brand} logo"
    - "logo of {brand}"
    - "official logo of {brand}"
    - "{brand} brand logo"
    - "{brand} wordmark"
    - "{brand} logomark"
    - "a clean logo of {brand}"

init_from: "./outputs_stage1/best.pt"
resume: ""
