name: source-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile source
        run: python -m compileall src scripts tests
      - name: Run dependency-free unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/unit -v
